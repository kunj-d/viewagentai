    <style>
        /* pwa */

        .mobile-screen {
            width: min(100%, 380px);
            aspect-ratio: 9/19.5;
            height: 640px;
            max-height: calc(100vh - 40px);
            border-radius: 0;
            overflow: hidden;
            position: relative;
            margin: auto;
        }

        .pattern-overlay {
            position: absolute;
            inset: 0;
            background-image: url('/app/assets/images/pre-pwa-bg.png');
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .install-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .logo-card {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            background: #160404;
            border: 1px solid rgba(255, 0, 0, .4);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow:
                0 0 15px rgba(255, 0, 0, .3),
                0 0 40px rgba(255, 0, 0, .15);
            animation: logoPulse 2s infinite;
        }

        .logo-card img {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        .app-name {
            color: #fff;
            font-size: 16px;
            margin-top: 14px;
            font-weight: 500;
            letter-spacing: .3px;
        }

        .install-btn {
            margin-top: 28px;
            border: none;
            background: linear-gradient(135deg,
                    #ff3939,
                    #d70000);

            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: .3s;
            box-shadow:
                0 0 15px rgba(255, 0, 0, .4);
        }

        .install-btn:hover {
            transform: translateY(-3px);
            box-shadow:
                0 10px 25px rgba(255, 0, 0, .45);
        }

        @keyframes logoPulse {

            0% {
                transform: scale(1);
                box-shadow:
                    0 0 15px rgba(255, 0, 0, .3);
            }

            50% {
                transform: scale(1.05);
                box-shadow:
                    0 0 25px rgba(255, 0, 0, .5);
            }

            100% {
                transform: scale(1);
                box-shadow:
                    0 0 15px rgba(255, 0, 0, .3);
            }
        }

        @media (min-width:1600px) {

            .mobile-screen {
                width: 420px;
            }

        }

        @media (max-width:1366px) {

            .mobile-screen {
                width: min(100%, 360px);
            }

        }

        @media (max-width:991px) {

            .mobile-screen {
                width: min(100%, 340px);
            }

            .container-wrapper {
                padding-top: 0;
            }

        }

        @media (max-width:768px) {

            .pwa-wrapper {
                padding: 10px;
            }

            .mobile-screen {
                width: min(100%, 320px);
            }

        }

        /* Mobile */

        @media(max-width:576px) {
            .mobile-screen {
                width: 100vw;
                height: 100dvh;
                max-height: unset;
                aspect-ratio: auto;
            }
        }
    </style>

   <script>
   console.log('SW Supported:', 'serviceWorker' in navigator);

    navigator.serviceWorker.getRegistrations()
      .then(r => console.log('Registrations:', r));
    
    console.log('Manifest:', document.querySelector('link[rel="manifest"]'));


    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');
    
    // Hide button initially
    installBtn.style.display = 'block';
    
    window.addEventListener('beforeinstallprompt', (e) => {
        console.log('beforeinstallprompt fired');
    
        e.preventDefault();
        deferredPrompt = e;
    
        installBtn.style.display = 'block';
    });
    
    installBtn.addEventListener('click', async () => {
    
        if (!deferredPrompt) {
            alert('Install prompt not available. App may already be installed or not eligible for installation.');
            return;
        }
    
        installBtn.style.display = 'none';
    
        try {
            await deferredPrompt.prompt();
    
            const { outcome } = await deferredPrompt.userChoice;
    
            console.log('User choice:', outcome);
    
            if (outcome === 'accepted') {
                console.log('App Installed');
            } else {
                console.log('Installation dismissed');
            }
        } catch (err) {
            console.error('Install error:', err);
        }
    
        deferredPrompt = null;
    });
    
    window.addEventListener('appinstalled', () => {
        console.log('✅ App successfully installed');
    
        installBtn.style.display = 'none';
        deferredPrompt = null;
    });
    window.addEventListener('beforeinstallprompt', () => {
        console.log('PWA installable');
    });
    
    window.addEventListener('load', () => {
        console.log('Page loaded');
    });
   
  </script>
